map $uri $cache_control {
  ~^/_astro/  "public, max-age=31536000, immutable";  # hashed build assets never change
  default     "no-cache";
}

server {
  listen 80;
  listen [::]:80;
  server_name _;
  root /usr/share/nginx/html;
  # Behind Coolify's proxy: keep redirects relative so scheme/port stay correct.
  absolute_redirect off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Set once here: any add_header inside a location would drop these.
  add_header Cache-Control $cache_control always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location = /healthz { access_log off; return 200 "ok"; }

  location / {
    try_files $uri $uri/ $uri.html =404;
  }

  error_page 404 /404.html;
}
